# Chapters: which transcript blocks each chapter carries (VIDEO_PLAN.md §8). Hand-edited.
# Chapters are construction units (a scene file and a render each); they're joined into one film at the end, so a
# split here shows only as a YouTube chapter marker.
#   ids:    explicit block ids (claimed first)
#   turns:  [first, last] turn numbers, inclusive (every block not already claimed)
#   hold_s: extra visual-only time the chapter needs beyond its lines (the envelope, the breaks, the side chats, ...)
#   page:   a file of voiced balloons the chapter adds after its lines (tools/script_lib.mjs's pageLines)
