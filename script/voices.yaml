# The film's voices (ElevenLabs). The voice tools read this; change a voice here and every line re-voices (clips are
# cached by voice, model and words, in assets/vo/).
model: eleven_v3

# The conversation's two voices (VIDEO_PLAN.md §3). The driver wears Curt's voice as part of its costume; the target
# speaks as River, as Claude did in axol-f.
costume:
  voice: qCYgSspmts8E3GyY0tyz   # "Curt Cox 2": Curt's own cloned voice, as in axol-f
target:
  voice: SAz9YHcvj6GT2YYXdXww   # "River", stock: relaxed, neutral. Claude's voice in axol-f, confirmed by Curt by ear

# The changeover: from this line (and phrase, if given) on, the driver speaks in the target's voice. If the phrase is
# inside the line, the line is voiced as two (script_lib.mjs's splitAtChangeover). Set by the changeover test
# (tools/changeover_test.mjs). Curt chose variant A, 2026-10-05: "I can't say that." in the costume's voice, River from
# "I'm Claude".
changeover: { line: T32.U.01, at: "I'm Claude" }

# The cold open's comic page (script/cold_open.yaml): six stock voices, one per person on the page, as in axol-f, so
# its clips are reused unchanged.
officer: { voice: SOYHLrjzK2X1ezoPC6cr }   # "Harry", fierce, rough: the shouting officer
handler: { voice: N2lVS1w4EtoT3dr4eOWO }   # "Callum", husky trickster: the ape's handler, covering fast
blond:   { voice: cjVigY5qzO86Huf0OWal }   # "Eric", smooth: the blond man, the cool accusation
bearded: { voice: pqHfZKP75CvOlQylNhV4 }   # "Bill", wise, old: the bearded man, denying it
villain: { voice: pNInz6obpgDQGcFmaJgB }   # "Adam", dominant, firm: the villain's speech
turtle:  { voice: CwhRBWXzGAHq8TQ4Fs17 }   # "Roger", laid-back, casual: the man in the turtleneck, aside to us
